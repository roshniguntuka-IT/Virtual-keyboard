<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Keyboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="keyboard-container">

        <div class="keyboard-title">
            <h1>Virtual Keyboard</h1>
            <p>Click the keys to type</p>
        </div>

        <div class="display-area">
            <textarea id="textInput" placeholder="Start typing here..."></textarea>
        </div>

        <div class="keyboard">

            <div class="keyboard-row function-row">

                <button class="key small">Esc</button>

                <button class="key small">F1</button>

                <button class="key small">F2</button>

                <button class="key small">F3</button>

                <button class="key small">F4</button>

                <button class="key small">F5</button>

                <button class="key small">F6</button>

                <button class="key small">F7</button>

                <button class="key small">F8</button>

                <button class="key small">F9</button>

                <button class="key small">F10</button>

                <button class="key small">F11</button>

                <button class="key small">F12</button>

                <button class="key small">Delete</button>

            </div>

            <div class="keyboard-row">

                <button class="key">`</button>

                <button class="key">
                    1
                    <span>!</span>
                </button>

                <button class="key">
                    2
                    <span>@</span>
                </button>

                <button class="key">
                    3
                    <span>#</span>
                </button>

                <button class="key">
                    4
                    <span>$</span>
                </button>

                <button class="key">
                    5
                    <span>%</span>
                </button>

                <button class="key">
                    6
                    <span>^</span>
                </button>

                <button class="key">
                    7
                    <span>&amp;</span>
                </button>

                <button class="key">
                    8
                    <span>*</span>
                </button>

                <button class="key">
                    9
                    <span>(</span>
                </button>

                <button class="key">
                    0
                    <span>)</span>
                </button>

                <button class="key">
                    -
                    <span>_</span>
                </button>

                <button class="key">
                    =
                    <span>+</span>
                </button>

                <button class="key wide">Backspace</button>

            </div>

            <div class="keyboard-row">

                <button class="key medium">Tab</button>

                <button class="key">Q</button>

                <button class="key">W</button>

                <button class="key">E</button>

                <button class="key">R</button>

                <button class="key">T</button>

                <button class="key">Y</button>

                <button class="key">U</button>

                <button class="key">I</button>

                <button class="key">O</button>

                <button class="key">P</button>

                <button class="key">
                    [
                    <span>{</span>
                </button>

                <button class="key">
                    ]
                    <span>}</span>
                </button>

                <button class="key">
                    \
                    <span>|</span>
                </button>

            </div>

            <div class="keyboard-row">

                <button class="key medium">Caps Lock</button>

                <button class="key">A</button>

                <button class="key">S</button>

                <button class="key">D</button>

                <button class="key">F</button>

                <button class="key">G</button>

                <button class="key">H</button>

                <button class="key">J</button>

                <button class="key">K</button>

                <button class="key">L</button>

                <button class="key">
                    ;
                    <span>:</span>
                </button>

                <button class="key">
                    '
                    <span>"</span>
                </button>

                <button class="key wide">Enter</button>

            </div>

            <div class="keyboard-row">

                <button class="key large">Shift</button>

                <button class="key">Z</button>

                <button class="key">X</button>

                <button class="key">C</button>

                <button class="key">V</button>

                <button class="key">B</button>

                <button class="key">N</button>

                <button class="key">M</button>

                <button class="key">
                    ,
                    <span>&lt;</span>
                </button>

                <button class="key">
                    .
                    <span>&gt;</span>
                </button>

                <button class="key">
                    /
                    <span>?</span>
                </button>

                <button class="key large">Shift</button>

            </div>

            <div class="keyboard-row bottom-row">

                <button class="key">Ctrl</button>

                <button class="key">Fn</button>

                <button class="key">Win</button>

                <button class="key">Alt</button>

                <button class="key space">Space</button>

                <button class="key">Alt</button>

                <button class="key">Ctrl</button>

                <div class="arrow-keys">

                    <button class="key arrow">↑</button>

                    <div class="arrow-bottom">

                        <button class="key arrow">←</button>

                        <button class="key arrow">↓</button>

                        <button class="key arrow">→</button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
