<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="An interactive virtual keyboard with accessible controls."
    >

    <title>Virtual Keyboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="keyboard-container">
        <header class="keyboard-title">
            <h1>Virtual Keyboard</h1>
            <p>Type using your physical keyboard or the buttons below.</p>
        </header>

        <section class="display-area" aria-labelledby="input-label">
            <label id="input-label" for="textInput">
                Your text
            </label>

            <textarea
                id="textInput"
                placeholder="Start typing here..."
                rows="4"
                spellcheck="true"
                autocapitalize="off"
            ></textarea>

            <div class="input-actions">
                <button type="button" id="clearButton" class="utility-button">
                    Clear text
                </button>

                <button type="button" id="copyButton" class="utility-button">
                    Copy text
                </button>
            </div>
        </section>

        <p
            id="keyboardStatus"
            class="status-message"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        >Ready to type.</p>

        <section class="keyboard-section" aria-label="On-screen keyboard">
            <div class="keyboard" id="keyboard">

                <div class="keyboard-row function-row">
                    <button class="key" data-key="Escape" aria-label="Escape">Esc</button>
                    <button class="key" data-key="F1">F1</button>
                    <button class="key" data-key="F2">F2</button>
                    <button class="key" data-key="F3">F3</button>
                    <button class="key" data-key="F4">F4</button>
                    <button class="key" data-key="F5">F5</button>
                    <button class="key" data-key="F6">F6</button>
                    <button class="key" data-key="F7">F7</button>
                    <button class="key" data-key="F8">F8</button>
                    <button class="key" data-key="F9">F9</button>
                    <button class="key" data-key="F10">F10</button>
                    <button class="key" data-key="F11">F11</button>
                    <button class="key" data-key="F12">F12</button>
                </div>

                <div class="keyboard-row">
                    <button class="key" data-key="`" data-shift="~">`</button>
                    <button class="key" data-key="1" data-shift="!">1 <span>!</span></button>
                    <button class="key" data-key="2" data-shift="@">2 <span>@</span></button>
                    <button class="key" data-key="3" data-shift="#">3 <span>#</span></button>
                    <button class="key" data-key="4" data-shift="$">4 <span>$</span></button>
                    <button class="key" data-key="5" data-shift="%">5 <span>%</span></button>
                    <button class="key" data-key="6" data-shift="^">6 <span>^</span></button>
                    <button class="key" data-key="7" data-shift="&amp;">7 <span>&amp;</span></button>
                    <button class="key" data-key="8" data-shift="*">8 <span>*</span></button>
                    <button class="key" data-key="9" data-shift="(">9 <span>(</span></button>
                    <button class="key" data-key="0" data-shift=")">0 <span>)</span></button>
                    <button class="key" data-key="-" data-shift="_">- <span>_</span></button>
                    <button class="key" data-key="=" data-shift="+">= <span>+</span></button>
                    <button class="key wide" data-key="Backspace" aria-label="Backspace">Backspace</button>
                </div>

                <div class="keyboard-row">
                    <button class="key wide" data-key="Tab">Tab</button>
                    <button class="key" data-key="Q">Q</button>
                    <button class="key" data-key="W">W</button>
                    <button class="key" data-key="E">E</button>
                    <button class="key" data-key="R">R</button>
                    <button class="key" data-key="T">T</button>
                    <button class="key" data-key="Y">Y</button>
                    <button class="key" data-key="U">U</button>
                    <button class="key" data-key="I">I</button>
                    <button class="key" data-key="O">O</button>
                    <button class="key" data-key="P">P</button>
                    <button class="key" data-key="[" data-shift="{">[ <span>{</span></button>
                    <button class="key" data-key="]" data-shift="}">] <span>}</span></button>
                    <button class="key" data-key="\" data-shift="|">\ <span>|</span></button>
                </div>

                <div class="keyboard-row">
                    <button class="key extra-wide" data-key="CapsLock" aria-pressed="false">Caps Lock</button>
                    <button class="key" data-key="A">A</button>
                    <button class="key" data-key="S">S</button>
                    <button class="key" data-key="D">D</button>
                    <button class="key" data-key="F">F</button>
                    <button class="key" data-key="G">G</button>
                    <button class="key" data-key="H">H</button>
                    <button class="key" data-key="J">J</button>
                    <button class="key" data-key="K">K</button>
                    <button class="key" data-key="L">L</button>
                    <button class="key" data-key=";" data-shift=":">; <span>:</span></button>
                    <button class="key" data-key="'" data-shift="&quot;">' <span>"</span></button>
                    <button class="key wide" data-key="Enter">Enter</button>
                </div>

                <div class="keyboard-row">
                    <button class="key extra-wide" data-key="Shift" aria-pressed="false">Shift</button>
                    <button class="key" data-key="Z">Z</button>
                    <button class="key" data-key="X">X</button>
                    <button class="key" data-key="C">C</button>
                    <button class="key" data-key="V">V</button>
                    <button class="key" data-key="B">B</button>
                    <button class="key" data-key="N">N</button>
                    <button class="key" data-key="M">M</button>
                    <button class="key" data-key="," data-shift="&lt;">, <span>&lt;</span></button>
                    <button class="key" data-key="." data-shift="&gt;">. <span>&gt;</span></button>
                    <button class="key" data-key="/" data-shift="?">/ <span>?</span></button>
                    <button class="key extra-wide" data-key="Shift" aria-pressed="false">Shift</button>
                </div>

                <div class="keyboard-row bottom-row">
                    <button class="key" data-key="Control" aria-pressed="false">Ctrl</button>
                    <button class="key" data-key="Meta" aria-label="Windows or Command key">Win</button>
                    <button class="key" data-key="Alt" aria-pressed="false">Alt</button>
                    <button class="key space-key" data-key="Space">Space</button>
                    <button class="key" data-key="Alt" aria-pressed="false">Alt</button>
                    <button class="key" data-key="Control" aria-pressed="false">Ctrl</button>

                    <div class="arrow-keys" aria-label="Cursor controls">
                        <button class="key arrow up" data-key="ArrowUp" aria-label="Move cursor up">↑</button>
                        <button class="key arrow left" data-key="ArrowLeft" aria-label="Move cursor left">←</button>
                        <button class="key arrow down" data-key="ArrowDown" aria-label="Move cursor down">↓</button>
                        <button class="key arrow right" data-key="ArrowRight" aria-label="Move cursor right">→</button>
                    </div>
                </div>
            </div>
        </section>

        <footer class="keyboard-footer">
            <p>Tip: Use Tab to navigate between controls and Enter or Space to activate buttons.</p>
        </footer>
    </main>
</body>
</html>
